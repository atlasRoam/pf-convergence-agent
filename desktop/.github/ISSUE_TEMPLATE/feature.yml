name: Feature request
description: Propose a desktop mapping for an existing Pi CLI / SDK capability.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What desktop workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: pi-capability
    attributes:
      label: Existing Pi capability
      description: Link or name the Pi CLI command, SDK API, event, or resource this maps to.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed desktop mapping
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
